# PROVISIONAL. Set against snapshots 261023–261027, which showed almost no
# major-road change: not enough history to calibrate. Revisit after ~2 weeks
# of daily runs (DESIGN §5.8).
# Two minutes separates material delays from small routing changes.
slow_seconds = 120
# Five minutes is a severe intercity detour.
high_slow_seconds = 300
# Half a percent of gravity-weighted intercity travel warrants escalation.
high_slowed_share = 0.005
# Ten broken local trips indicate a broader connectivity problem.
high_local_broken = 10
# Limit endpoint movement to a nearby replacement vertex.
snap_fallback_m = 200

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache DuckDB extensions
        uses: actions/cache@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-ext-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            duckdb-ext-${{ runner.os }}-
      - name: Install osmium-tool (tests build small PBFs with it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends osmium-tool
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Install DuckDB spatial extension
        run: make setup
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint
        run: make lint
      - name: Test
        run: make test

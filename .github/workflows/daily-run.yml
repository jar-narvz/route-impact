name: Daily run

on:
  workflow_call:
    inputs:
      date:
        type: string
        default: ''
      test_high:
        type: boolean
        default: false
      last_attempt:
        type: boolean
        required: true
      simulate_connect_failure:
        type: boolean
        default: false
    outputs:
      retry_elsewhere:
        value: ${{ jobs.run.outputs.retry_elsewhere }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      retry_elsewhere: ${{ steps.daily.outputs.retry_elsewhere }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache DuckDB extensions
        uses: actions/cache@v5
        with:
          path: ~/.duckdb/extensions
          key: duckdb-ext-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            duckdb-ext-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Install DuckDB spatial extension
        run: make setup
      - name: Plan window
        id: plan
        if: inputs.test_high != true
        run: |
          args=(plan --max-gap "${DAILY_MAX_GAP_DAYS:-3}")
          if [[ -n "$DATE" ]]; then args+=(--date "$DATE"); fi
          python -m route_impact.daily "${args[@]}"
        env:
          DATE: ${{ inputs.date }}
      - name: Restore OLD snapshot
        if: inputs.test_high != true && steps.plan.outputs.skip != 'true'
        uses: actions/cache/restore@v5
        with:
          path: data/pbf-cache
          key: norcal-pbf-${{ steps.plan.outputs.old }}
      - name: Run daily impact
        id: daily
        run: bash scripts/daily.sh
        env:
          DATE: ${{ inputs.date }}
          TEST_HIGH: ${{ inputs.test_high }}
          DAILY_LAST_ATTEMPT: ${{ inputs.last_attempt }}
          DAILY_SIMULATE_CONNECT_FAILURE: ${{ inputs.simulate_connect_failure }}
          GH_TOKEN: ${{ github.token }}
      - name: Save NEW snapshot
        continue-on-error: true
        if: steps.daily.outputs.publish == 'true'
        uses: actions/cache/save@v5
        with:
          path: data/pbf-cache
          key: norcal-pbf-${{ steps.plan.outputs.new }}

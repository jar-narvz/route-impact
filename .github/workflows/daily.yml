name: Daily

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD (NEW snapshot); empty = yesterday UTC'
        type: string
        required: false
      test_high:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      issues: write
    outputs:
      publish: ${{ steps.daily.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache DuckDB extensions
        uses: actions/cache@v5
        with:
          path: ~/.duckdb/extensions
          key: duckdb-ext-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            duckdb-ext-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Install DuckDB spatial extension
        run: make setup
      - name: Run daily impact
        id: daily
        run: bash scripts/daily.sh
        env:
          DATE: ${{ inputs.date }}
          TEST_HIGH: ${{ inputs.test_high }}
          GH_TOKEN: ${{ github.token }}

  pages:
    needs: run
    if: needs.run.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}site/
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Build Pages artifact
        run: mkdir _site && cp -R site results _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy

name: Daily

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD (NEW snapshot); empty = yesterday UTC'
        type: string
        required: false
      test_high:
        type: boolean
        default: false

      simulate_connect_failure:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  attempt1:
    uses: ./.github/workflows/daily-run.yml
    permissions:
      contents: write
      issues: write
    with:
      date: ${{ inputs.date }}
      test_high: ${{ inputs.test_high == true }}
      simulate_connect_failure: ${{ inputs.simulate_connect_failure == true }}
      last_attempt: false
  attempt2:
    needs: attempt1
    if: needs.attempt1.outputs.retry_elsewhere == 'true'
    uses: ./.github/workflows/daily-run.yml
    permissions:
      contents: write
      issues: write
    with:
      date: ${{ inputs.date }}
      test_high: ${{ inputs.test_high == true }}
      simulate_connect_failure: ${{ inputs.simulate_connect_failure == true }}
      last_attempt: false
  attempt3:
    needs: attempt2
    if: needs.attempt2.outputs.retry_elsewhere == 'true'
    uses: ./.github/workflows/daily-run.yml
    permissions:
      contents: write
      issues: write
    with:
      date: ${{ inputs.date }}
      test_high: ${{ inputs.test_high == true }}
      simulate_connect_failure: ${{ inputs.simulate_connect_failure == true }}
      last_attempt: true
